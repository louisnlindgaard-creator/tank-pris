<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#174ea6"><title>TankPris</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#e7eaee;color:#17202a}.app{height:100dvh;max-width:800px;margin:auto;background:#f5f6f7;display:flex;flex-direction:column;overflow:hidden}header{padding:11px 14px;background:#fff;border-bottom:1px solid #c8cdd3;display:flex}.logo{font-size:24px;font-weight:900;color:#174ea6}.stat{margin-left:auto;font-size:11px;font-weight:800;color:#15783a}.tools,.fuels{background:#fff;padding:8px;display:grid;gap:6px;border-bottom:1px solid #c8cdd3}.tools{grid-template-columns:1fr 90px 110px}.fuels{grid-template-columns:repeat(4,1fr)}button,input,select{font:inherit}button,input,select{padding:9px;border:1px solid #888;border-radius:7px;background:#fff}button{font-weight:800}.on,.primary{background:#174ea6;color:#fff;border-color:#174ea6}.map{flex:1;min-height:280px;position:relative}.notice{position:absolute;z-index:999;top:8px;left:8px;right:8px;background:#fff;border:1px solid #999;border-radius:8px;padding:8px;font-size:12px;box-shadow:0 2px 8px #0002}.market{position:absolute;z-index:999;bottom:8px;left:8px;background:#fff;border:1px solid #999;border-radius:8px;padding:9px;box-shadow:0 2px 8px #0002}.market b{font-size:18px}.list{background:#fff;max-height:30%;overflow:auto;border-top:1px solid #c8cdd3}.item{display:grid;grid-template-columns:38px 1fr auto;gap:8px;padding:8px;border-bottom:1px solid #eee}.badge{width:36px;height:36px;border-radius:50%;background:#e5ebf6;color:#174ea6;display:grid;place-items:center;font-weight:900}.name{font-weight:800}.small{font-size:11px;color:#666}.price{font-weight:900}.bottom{background:#fff;padding:8px;display:grid;grid-template-columns:1fr 1fr;gap:7px}@media(max-width:600px){.tools{grid-template-columns:1fr 82px}.tools select{grid-column:1/-1}.list{max-height:32%}}</style></head><body><div class="app"><header><div class="logo">⛽ TankPris</div><div class="stat" id="stat">FORBINDER…</div></header><div class="tools"><input id="q" placeholder="Søg by eller sted"><button id="search">Søg</button><select id="country"><option value="DK">🇩🇰 Danmark</option><option value="SE">🇸🇪 Sverige</option><option value="NO">🇳🇴 Norge</option></select></div><div class="fuels"><button class="fuel on" data-f="sp95">95</button><button class="fuel" data-f="sp98">98</button><button class="fuel" data-f="diesel">Diesel</button><button class="fuel" data-f="el">⚡ El</button></div><div class="map"><div id="map" style="height:100%"></div><div class="notice" id="notice">Henter aktuelle data…</div><div class="market" id="market"><b>—</b><div class="small">national prisstatus</div></div></div><div class="list" id="list"></div><div class="bottom"><button id="loc">◎ Min placering</button><button class="primary" id="report">⚠ Rapportér pris</button></div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const S="https://www.fuel-prices.eu/live/api.php?action=summary",M={DK:[[56.1,10],6],SE:[[59.3,15],5],NO:[[64,11],5]};let fuel="sp95",cc="DK",stations=[];const map=L.map("map").setView(...M.DK);L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OpenStreetMap contributors"}).addTo(map);const layer=L.layerGroup().addTo(map);const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));const fName=()=>fuel==="sp95"?"95":fuel==="sp98"?"98":fuel==="diesel"?"Diesel":"El";async function summary(){try{let j=await(await fetch(S,{cache:"no-store"})).json(),c=j.data.countries.find(x=>x.country_code===cc),f=c?.fuels?.[fuel];document.getElementById("market").innerHTML=f?'<b>'+f.avg.toFixed(3)+' EUR/l</b><div class="small">'+fName()+' nationalt gennemsnit</div>':'<b>—</b><div class="small">Ingen data</div>';document.getElementById("notice").textContent="Nationale priser opdateres fra live datakilde. Stationspris vises kun ved verificeret stationsfeed.";document.getElementById("stat").textContent="DATA OK"}catch(e){document.getElementById("stat").textContent="DATAFEJL";document.getElementById("notice").textContent="Live-data kunne ikke hentes. Ingen opdigtede priser vises."}}async function osm(){const c=map.getCenter(),q='[out:json][timeout:20];nwr(around:20000,'+c.lat+','+c.lng+')[amenity=fuel];out center tags;',u='https://overpass-api.de/api/interpreter?data='+encodeURIComponent(q);try{let j=await(await fetch(u)).json();return j.elements.map(x=>({name:x.tags?.name||x.tags?.brand||"Tankstation",address:[x.tags?.['addr:street'],x.tags?.['addr:housenumber'],x.tags?.['addr:city']].filter(Boolean).join(" "),lat:x.lat??x.center?.lat,lng:x.lon??x.center?.lon,price:null,source:"OpenStreetMap"})).filter(x=>x.lat&&x.lng)}catch(e){return[]}}async function noPrices(){try{let c=map.getCenter(),u='https://backend.drivstoffapp.no/stations/fuel/nearby?lat='+c.lat+'&lng='+c.lng+'&radius=20',j=await(await fetch(u)).json(),a=j.stations||j.data||[];return a.map(s=>({name:s.name||"Tankstation",address:s.address||"",lat:+(s.lat??s.latitude),lng:+(s.lng??s.longitude),price:(s.prices||{})[fuel]??null,source:"Drivstoffapp"})).filter(x=>x.lat&&x.lng)}catch(e){return[]}}async function render(){layer.clearLayers();let a=cc==="NO"?await noPrices():await osm();stations=a;let Ls=document.getElementById("list");Ls.innerHTML=a.slice(0,80).map((s,i)=>'<div class="item"><div class="badge">'+(i+1)+'</div><div><div class="name">'+esc(s.name)+'</div><div class="small">'+esc(s.address)+'</div></div><div class="price">'+(s.price!=null?Number(s.price).toFixed(2):"—")+'</div></div>').join("")||'<div class="small" style="padding:12px">Ingen stationer fundet.</div>';a.forEach(s=>{let m=L.circleMarker([s.lat,s.lng],{radius:7,weight:2}).addTo(layer);m.bindPopup('<b>'+esc(s.name)+'</b><br>'+esc(s.address||"")+'<br>'+fName()+': '+(s.price!=null?Number(s.price).toFixed(2)+" "+(cc==="NO"?"NOK/l":"kr/l"):"pris ikke tilgængelig")+'<br><small>'+esc(s.source)+'</small>')})}async function reload(){await summary();await render()}document.querySelectorAll(".fuel").forEach(b=>b.onclick=()=>{document.querySelectorAll(".fuel").forEach(x=>x.classList.remove("on"));b.classList.add("on");fuel=b.dataset.f;reload()});country.onchange=()=>{cc=country.value;map.setView(...M[cc]);reload()};document.getElementById("loc").onclick=()=>navigator.geolocation?.getCurrentPosition(p=>{map.setView([p.coords.latitude,p.coords.longitude],12);render()},()=>alert("Placering blev ikke givet."));document.getElementById("search").onclick=async()=>{let q=document.getElementById("q").value.trim();if(!q)return;let j=await(await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&q="+encodeURIComponent(q))).json();if(j[0]){map.setView([+j[0].lat,+j[0].lon],12);render()}else alert("Stedet blev ikke fundet.")};document.getElementById("report").onclick=()=>alert("Rapportfunktionen er klar i appens produktionsarkitektur; denne statiske version gemmer ikke data på en server endnu.");reload();setInterval(reload,900000);</script></body></html>
