<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#174ea6">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>TankPris</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<style>
:root{--blue:#174ea6;--blue2:#0f3f8c;--bg:#eef1f4;--line:#c9ced6;--muted:#66717c;--green:#167a3b;--red:#b42318}
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Arial,Helvetica,sans-serif;color:#17202a}body{background:#dfe3e7}
.app{height:100dvh;max-width:1100px;margin:auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
header{height:58px;background:#fff;border-bottom:1px solid var(--line);padding:9px 14px;display:flex;align-items:center;gap:10px}
.logo{font-size:24px;font-weight:900;color:var(--blue)}.status{margin-left:auto;text-align:right;font-size:11px;font-weight:800;color:var(--green)}
.controls{background:#fff;padding:8px;display:grid;grid-template-columns:1fr 82px 140px;gap:7px;border-bottom:1px solid var(--line)}
.controls input,.controls select,.controls button,.fuelbar button,.bottom button,.dialog input,.dialog select{font:inherit}.controls input,.controls select,.controls button,.fuelbar button,.bottom button{padding:10px;border:1px solid #7b838c;border-radius:7px;background:#fff}
.controls button,.primary,.fuelbar .on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:800}
.fuelbar{background:#fff;padding:8px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;border-bottom:1px solid var(--line)}
.mapwrap{position:relative;flex:1;min-height:300px}.map{width:100%;height:100%}.notice{position:absolute;left:9px;right:9px;top:9px;z-index:900;background:#fff;border:1px solid #999;border-radius:8px;padding:8px;font-size:12px;box-shadow:0 2px 8px #0002}
.summary{position:absolute;left:9px;bottom:9px;z-index:900;background:#fff;border:1px solid #999;border-radius:9px;padding:10px;box-shadow:0 2px 8px #0002;max-width:310px}.summary b{font-size:20px}
.list{background:#fff;max-height:34%;overflow:auto;border-top:1px solid var(--line)}.listhead{padding:7px 9px;font-size:12px;font-weight:800;border-bottom:1px solid #eee;display:flex;justify-content:space-between}
.item{display:grid;grid-template-columns:40px 1fr auto;gap:8px;align-items:center;padding:8px 9px;border-bottom:1px solid #eee;cursor:pointer}.item:hover{background:#f1f4f7}
.badge{width:36px;height:36px;border-radius:50%;background:#e6edf8;color:var(--blue);display:grid;place-items:center;font-weight:900}.name{font-weight:800}.small{font-size:11px;color:var(--muted);margin-top:2px}.price{font-size:17px;font-weight:900;text-align:right}.fresh{font-size:10px;color:var(--muted);text-align:right;margin-top:2px}
.ad{margin:8px;background:#fff;border:1px solid #bbb;border-radius:7px;padding:7px;text-align:center;color:#777;font-size:11px}
.bottom{background:#fff;border-top:1px solid var(--line);padding:8px;display:grid;grid-template-columns:1fr 1fr;gap:7px}
.modal{display:none;position:fixed;inset:0;background:#0007;z-index:3000;align-items:flex-end;justify-content:center}.modal.show{display:flex}.dialog{background:#fff;width:min(650px,100%);padding:15px;border-radius:15px 15px 0 0}.dialog h2{margin:0 0 8px;font-size:20px}.reportgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.wide{grid-column:1/-1}.dialog input,.dialog select{width:100%}.reportnote{font-size:11px;color:#606b76;margin-top:8px}
@media(max-width:650px){.controls{grid-template-columns:1fr 82px}.controls select{grid-column:1/-1}.list{max-height:37%}}
</style>
</head>
<body>
<div class="app">
<header><div class="logo">⛽ TankPris</div><div class="status" id="status">STARTER…</div></header>
<div class="controls">
<input id="search" placeholder="Søg station, by eller adresse">
<button id="searchBtn">Søg</button>
<select id="country"><option value="ALL">🌍 Skandinavien</option><option value="DK">🇩🇰 Danmark</option><option value="SE">🇸🇪 Sverige</option><option value="NO">🇳🇴 Norge</option></select>
</div>
<div class="fuelbar"><button class="fuel on" data-f="sp95">95</button><button class="fuel" data-f="sp98">98</button><button class="fuel" data-f="diesel">Diesel</button><button class="fuel" data-f="el">⚡ El</button></div>
<div class="mapwrap"><div id="map" class="map"></div><div class="notice" id="notice">Henter stationsdata…</div><div class="summary" id="summary"><b>—</b><div class="small">Prisstatus</div></div></div>
<div class="ad">ANNONCE · plads reserveret til din reklamepartner</div>
<div class="list" id="list"></div>
<div class="bottom"><button id="loc">◎ Min placering</button><button id="reportBtn" class="primary">⚠ Rapportér pris</button></div>
</div>

<div class="modal" id="modal"><div class="dialog">
<div style="display:flex;justify-content:space-between;align-items:center"><h2>Rapportér ny pris</h2><button id="close">✕</button></div>
<div class="reportgrid"><input id="rstation" class="wide" placeholder="Tankstation"><select id="rfuel"><option value="sp95">95</option><option value="sp98">98</option><option value="diesel">Diesel</option><option value="el">El</option></select><input id="rprice" type="number" step="0.01" placeholder="Ny pris"><button id="submitReport" class="primary wide">Opret rapport</button></div>
<div class="reportnote" id="rmsg">Rapporten åbner en færdigudfyldt GitHub-rapport, så oplysningerne kan sendes ind uden at appen gemmer en adgangsnøgle.</div>
</div></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
const META={DK:{name:"Danmark",bounds:[[54.4,8],[57.9,15.5]],currency:"DKK"},SE:{name:"Sverige",bounds:[[55,10.5],[69.2,24.5]],currency:"SEK"},NO:{name:"Norge",bounds:[[57.8,4],[71.5,31.5]],currency:"NOK"}};
const map=L.map("map").fitBounds([[54.4,4],[71.5,31.5]]);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap contributors"}).addTo(map);
const clusters=L.markerClusterGroup({chunkedLoading:true,showCoverageOnHover:false}).addTo(map);
let country="ALL",fuel="sp95",all=[],selected=null,lastLoad=0;
const reportBtn=document.getElementById("reportBtn");
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function nameFuel(){return fuel==="sp95"?"95":fuel==="sp98"?"98":fuel==="diesel"?"Diesel":"El"}
function getBoundsFor(c){return c==="ALL"?[[54.4,4],[71.5,31.5]]:META[c].bounds}
async function fetchOne(cc){
 const u="./data/"+cc+"-"+fuel+".json?"+Date.now();
 const r=await fetch(u,{cache:"no-store"});if(!r.ok)throw new Error("missing "+cc+"-"+fuel);return await r.json();
}
async function load(){
 document.getElementById("status").textContent="HENTER…";document.getElementById("notice").textContent="Henter aktuelle stationsdata…";
 try{
  const docs=country==="ALL"?await Promise.all(["DK","SE","NO"].map(fetchOne)): [await fetchOne(country)];
  all=docs.flatMap(d=>d.stations||[]).filter(s=>Number.isFinite(Number(s.lat))&&Number.isFinite(Number(s.lng)));
  render(docs);
  document.getElementById("status").textContent=all.length.toLocaleString("da-DK")+" STATIONER";
 }catch(e){
  all=[];clusters.clearLayers();document.getElementById("list").innerHTML="<div class='small' style='padding:12px'>Stationsdata er endnu ikke blevet hentet af den automatiske dataopdatering. GitHub Actions kører dataindsamlingen hvert 15. minut.</div>";
  document.getElementById("summary").innerHTML="<b>—</b><div class='small'>Ingen live stationsdata</div>";
  document.getElementById("notice").textContent="Ingen verificerede stationspriser tilgængelige lige nu. Appen viser ingen opdigtede priser.";
  document.getElementById("status").textContent="INGEN DATA";
 }
}
function render(docs){
 clusters.clearLayers();
 const valid=all.filter(s=>s.price!=null).sort((a,b)=>a.price-b.price);
 if(country==="ALL"){
   document.getElementById("summary").innerHTML=valid.length?"<b>"+valid[0].price.toFixed(2)+" "+valid[0].currency+"/L</b><div class='small'>laveste tilgængelige "+nameFuel()+" · "+esc(valid[0].name)+"</div>":"<b>—</b><div class='small'>ingen verificeret pris</div>";
   const stamps=docs.map(d=>d.updatedAtSource).filter(Boolean);document.getElementById("notice").textContent="Skandinavien · "+nameFuel()+" · kildens seneste stationsstempel: "+(stamps.sort().slice(-1)[0]||"ukendt");
 }else{
   document.getElementById("summary").innerHTML=valid.length?"<b>"+valid[0].price.toFixed(2)+" "+valid[0].currency+"/L</b><div class='small'>laveste "+nameFuel()+" i "+META[country].name+" · "+esc(valid[0].name)+"</div>":"<b>—</b><div class='small'>ingen verificeret pris</div>";
   document.getElementById("notice").textContent=META[country].name+" · "+nameFuel()+" · priser har kilde- og tidspunktfelter.";
 }
 document.getElementById("list").innerHTML="<div class='listhead'><span>"+(country==="ALL"?"Skandinavien":META[country].name)+" · "+nameFuel()+"</span><span>"+all.length.toLocaleString("da-DK")+" stationer</span></div>"+
 all.slice().sort((a,b)=>(a.price??999)-(b.price??999)).slice(0,300).map((s,i)=>"<div class='item' data-id='"+esc(s.id)+"'><div class='badge'>"+(i+1)+"</div><div><div class='name'>"+esc(s.name)+"</div><div class='small'>"+esc(s.brand)+(s.address?" · "+esc(s.address):"")+(s.city?" · "+esc(s.city):"")+"</div></div><div><div class='price'>"+(s.price!=null?s.price.toFixed(2)+" "+esc(s.currency):"—")+"</div><div class='fresh'>"+esc(s.reportedAt||"pris mangler")+"</div></div></div>").join("");
 all.forEach(s=>{
  const popup="<b>"+esc(s.name)+"</b><br>"+esc(s.address||"")+"<br>"+esc(s.city||"")+"<br><strong>"+nameFuel()+": "+(s.price!=null?s.price.toFixed(2)+" "+esc(s.currency):"pris mangler")+"</strong><br><small>"+esc(s.reportedAt||"Ingen prisstempel")+"</small><br><button onclick=\"window.selectStation('"+encodeURIComponent(s.id)+"')\">Vælg station</button>";
  const m=L.circleMarker([s.lat,s.lng],{radius:5,weight:2}).bindPopup(popup);m.on("click",()=>selected=s);clusters.addLayer(m);
 });
 document.querySelectorAll(".item").forEach(el=>el.onclick=()=>{const s=all.find(x=>String(x.id)===el.dataset.id);if(s){selected=s;map.setView([s.lat,s.lng],15);}});
}
window.selectStation=function(id){const s=all.find(x=>String(x.id)===decodeURIComponent(id));if(s)selected=s};
document.querySelectorAll(".fuel").forEach(b=>b.onclick=()=>{document.querySelectorAll(".fuel").forEach(x=>x.classList.remove("on"));b.classList.add("on");fuel=b.dataset.f;load()});
document.getElementById("country").onchange=e=>{country=e.target.value;map.fitBounds(getBoundsFor(country));load()};
document.getElementById("loc").onclick=()=>navigator.geolocation?.getCurrentPosition(p=>{map.setView([p.coords.latitude,p.coords.longitude],13)},()=>alert("Placering blev ikke givet."));
document.getElementById("searchBtn").onclick=()=>{const q=document.getElementById("search").value.trim().toLowerCase();if(!q)return;const s=all.find(x=>(x.name+" "+x.address+" "+x.city+" "+x.brand).toLowerCase().includes(q));if(!s){alert("Stedet blev ikke fundet i de hentede stationer.");return}selected=s;map.setView([s.lat,s.lng],15)};
reportBtn.onclick=()=>{document.getElementById("modal").classList.add("show");document.getElementById("rstation").value=selected?.name||"";document.getElementById("rfuel").value=fuel;document.getElementById("rmsg").textContent="Rapporten oprettes som en færdigudfyldt GitHub Issue.";
};
document.getElementById("close").onclick=()=>document.getElementById("modal").classList.remove("show");
document.getElementById("submitReport").onclick=()=>{const name=document.getElementById("rstation").value.trim(),f=document.getElementById("rfuel").value,p=Number(document.getElementById("rprice").value);if(!name||!p){document.getElementById("rmsg").textContent="Udfyld station og pris.";return}const body=encodeURIComponent("Station: "+name+"\nBrændstof: "+f+"\nRapporteret pris: "+p+"\nLand: "+country+"\nTidspunkt: "+new Date().toISOString());const title=encodeURIComponent("Prisrapport: "+name+" – "+f);window.open("https://github.com/louisnlindgaard-creator/tank-pris/issues/new?title="+title+"&body="+body,"_blank");};
load();setInterval(load,900000);
</script>
</body></html>
