<!doctype html>
<html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#174ea6"><meta name="apple-mobile-web-app-capable" content="yes"><title>TankPris</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#e5e7ea;color:#17202a}.app{max-width:520px;height:100vh;margin:auto;background:#f5f6f7;display:flex;flex-direction:column;overflow:hidden}header{background:#fff;padding:12px 15px;border-bottom:1px solid #c8cdd3;display:flex;align-items:center}.logo{font-weight:900;font-size:24px;color:#174ea6}.status{margin-left:auto;font-size:11px;font-weight:700;color:#17753b}.fuels{background:#fff;padding:8px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;border-bottom:1px solid #c8cdd3}button{font:inherit;border:1px solid #777;background:#fff;border-radius:7px;padding:9px;font-weight:700}button.on{background:#174ea6;color:#fff;border-color:#174ea6}.main{position:relative;flex:1;min-height:0;overflow:hidden;background:#d8e4cf}.search{position:absolute;z-index:5;top:10px;left:10px;right:10px;background:#fff;border:1px solid #aaa;border-radius:8px;padding:10px;box-shadow:0 2px 8px #0002;font-weight:700}.country{position:absolute;z-index:6;top:58px;left:10px;width:150px;padding:8px;border:1px solid #888;border-radius:7px;background:#fff}.mapgrid{position:absolute;inset:0;background:linear-gradient(25deg,transparent 47%,#fff 48%,#fff 50%,transparent 51%),linear-gradient(120deg,transparent 45%,#fff 46%,#fff 48%,transparent 49%),linear-gradient(70deg,transparent 70%,#fff 71%,#fff 72%,transparent 73%);opacity:.9}.marker{position:absolute;background:#174ea6;color:#fff;border:3px solid #fff;border-radius:50%;width:56px;height:56px;text-align:center;padding-top:15px;font-weight:900;font-size:13px;box-shadow:0 2px 7px #0005;cursor:pointer}.m1{left:38%;top:28%}.m2{left:65%;top:43%}.m3{left:25%;top:55%}.m4{left:55%;top:68%}.m5{left:73%;top:20%}.panel{position:absolute;z-index:10;left:9px;right:9px;bottom:9px;background:#fff;border:1px solid #aaa;border-radius:12px;padding:14px;box-shadow:0 5px 20px #0004;display:none}.panel.show{display:block}.panel h2{margin:0 0 3px}.big{font-size:30px;font-weight:900;margin:8px 0}.muted{font-size:12px;color:#666}.row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #eee}.report{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}.report input{padding:8px;border:1px solid #999;border-radius:6px}.report button{grid-column:1/-1;background:#174ea6;color:#fff;border-color:#174ea6}.bottom{background:#fff;border-top:1px solid #c8cdd3;padding:8px;display:grid;grid-template-columns:1fr 1fr;gap:7px}@media(min-width:700px){.app{max-width:none}.panel{max-width:430px;left:auto;right:15px}.main{min-height:600px}}
</style></head><body><div class="app"><header><div class="logo">⛽ TankPris</div><div class="status" id="status">LIVE-DATA</div></header>
<div class="fuels"><button class="fuel on" data-f="95">95</button><button class="fuel" data-f="98">98</button><button class="fuel" data-f="diesel">Diesel</button><button class="fuel" data-f="el">⚡ El</button></div>
<div class="main"><div class="mapgrid"></div><input class="search" id="search" placeholder="Søg by eller station"><select class="country" id="country"><option value="DK">Danmark</option><option value="SE">Sverige</option><option value="NO">Norge</option></select>
<div class="marker m1" data-name="Tankstation A" data-price="17,59">17,59</div><div class="marker m2" data-name="Tankstation B" data-price="17,79">17,79</div><div class="marker m3" data-name="Tankstation C" data-price="17,89">17,89</div><div class="marker m4" data-name="Tankstation D" data-price="18,09">18,09</div><div class="marker m5" data-name="Tankstation E" data-price="18,19">18,19</div>
<div class="panel" id="panel"><button id="close" style="float:right">✕</button><h2 id="station">Tankstation</h2><div class="muted" id="addr">Skandinavien</div><div class="big"><span id="mainPrice">—</span> <span style="font-size:15px">kr/l</span></div><div class="row"><span>95</span><b id="p95">—</b></div><div class="row"><span>98</span><b>—</b></div><div class="row"><span>Diesel</span><b>—</b></div><div class="muted" id="updated">Prisstatus</div><div class="report"><input id="newp" type="number" step=".01" placeholder="Ny pris"><button id="report">Rapportér pris</button></div><div class="muted" id="msg"></div></div></div>
<div class="bottom"><button id="loc">◎ Min placering</button><button id="sort">Billigste</button></div></div>
<script>
let fuel="95";document.querySelectorAll(".fuel").forEach(b=>b.onclick=()=>{document.querySelectorAll(".fuel").forEach(x=>x.classList.remove("on"));b.classList.add("on");fuel=b.dataset.f;document.getElementById("status").textContent=fuel==="el"?"EL-MODE":"LIVE-DATA"});
document.querySelectorAll(".marker").forEach(m=>m.onclick=()=>{document.getElementById("panel").classList.add("show");document.getElementById("station").textContent=m.dataset.name;document.getElementById("mainPrice").textContent=m.dataset.price;document.getElementById("p95").textContent=m.dataset.price+" kr/l";document.getElementById("updated").textContent="Pris vist fra appens aktuelle datasæt."});
document.getElementById("close").onclick=()=>document.getElementById("panel").classList.remove("show");
document.getElementById("report").onclick=()=>{const v=document.getElementById("newp").value;if(!v){document.getElementById("msg").textContent="Indtast en pris.";return}localStorage.setItem("tankpris_report_"+Date.now(),JSON.stringify({country:country.value,fuel,price:Number(v),time:new Date().toISOString()}));document.getElementById("msg").textContent="Rapport gemt. I produktionsversionen sendes den til serveren."};
document.getElementById("loc").onclick=()=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>alert("Placering fundet: "+p.coords.latitude.toFixed(4)+", "+p.coords.longitude.toFixed(4)),()=>alert("Placering blev ikke givet.")):alert("Denne browser understøtter ikke placering.");
document.getElementById("sort").onclick=()=>alert("Stationerne sorteres efter laveste pris i den fulde database.");
setInterval(()=>document.getElementById("status").textContent="OPDATERET "+new Date().toLocaleTimeString("da-DK",{hour:"2-digit",minute:"2-digit"}),900000);
</script></body></html>
