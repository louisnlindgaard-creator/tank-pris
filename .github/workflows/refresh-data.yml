name: Refresh TankPris data
# Runs at least every 15 minutes; source feeds may themselves update less often.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tankpris-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch station prices
        run: python3 scripts/fetch-data.py
      - name: Commit changes
        run: |
          git config user.name "tankpris-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh station data [skip ci]"
          git push